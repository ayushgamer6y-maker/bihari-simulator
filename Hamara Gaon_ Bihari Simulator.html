<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#87bfe8;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{display:block}

#mbtns button:nth-child(2){animation-delay:.08s}#mbtns button:nth-child(3){animation-delay:.16s}#mbtns button:nth-child(4){animation-delay:.24s}#mbtns button:nth-child(5){animation-delay:.32s}

#bPunch.round{background:radial-gradient(circle at 35% 28%,#ff7a4a,#8a1408 75%)}#run.round{background:radial-gradient(circle at 35% 28%,#5ac45a,#12461a 75%)}#bJump.round{background:radial-gradient(circle at 35% 28%,#4aa8ff,#0c2f6a 75%)}
#topbtns{position:fixed;top:134px;left:auto;right:8px;display:flex;gap:6px;z-index:1}

#task{top:182px}
#loc{position:fixed;top:140px;left:8px;max-width:170px;padding:3px 9px;border-radius:12px;background:#000a;font-size:11px;font-weight:700;text-align:center;pointer-events:none}
#fuel{position:fixed;left:18px;bottom:162px;width:84px;display:none;text-align:center;background:#000b;border-radius:12px;padding:6px;pointer-events:none}
#speed{font:900 26px monospace;color:#7affc0}#fuel small{font-size:9px}
#fightHud{position:fixed;top:182px;left:8px;right:8px;display:none;gap:8px;align-items:center;background:#000b;padding:8px;border-radius:10px;font-size:11px;text-align:center;pointer-events:none}
#fightHud div{flex:1}#fightHud span{font-weight:900;color:#ffd94a}
.fbar{height:11px;background:#400;border-radius:6px;overflow:hidden;margin-top:3px}.fbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd21f,#3ad04a)}
#work{position:fixed;left:0;right:0;bottom:0;display:none;z-index:3;background:#241204ee;border-top:3px solid #ffb81f;padding:8px 12px 12px;text-align:center}
#wkTitle{font-weight:800;font-size:15px;margin-bottom:6px;color:#ffe27a}
#wkBody button{margin:4px auto;font-size:16px;background:#c85a08}
#wkQuit{display:block;margin:6px auto 0;padding:5px 14px;font-size:11px}
#meter{position:relative;height:22px;background:#702018;border-radius:11px;margin:6px auto;max-width:300px}
#meter i{position:absolute;left:38%;width:24%;top:0;bottom:0;background:#2fb84a}#ptr{position:absolute;top:-4px;width:4%;height:30px;background:#fff;border-radius:3px}
#pad{display:block;margin:0 auto;touch-action:none;border:3px solid #6e4020;border-radius:8px;max-height:34vh}#pad.kadahi{border-radius:50%}
#pumpRow{display:flex;gap:10px;justify-content:center}#pumpRow button{padding:18px 22px}
#bigmap{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#0a1006f2}
#bmTop{display:flex;gap:8px;align-items:center;font-size:13px}#bmTop button{padding:7px 11px;font-size:11px}
#bm{border:3px solid #e8a33d;border-radius:8px;touch-action:none}#bmInfo{font-size:12px;color:#ffd94a}
body.inmenu #topbtns,body.inmenu #loc,body.inmenu #fuel,body.cine #topbtns,body.cine #loc,body.cine #fuel,body.cine #msg{display:none!important}
@media (max-height:520px){#fightpad{grid-template-columns:repeat(5,52px)}button.round,#run.round{width:52px;height:52px}#btns{flex-direction:column;flex-wrap:nowrap;max-width:none}#topbtns{top:112px}#task{top:160px}#fightHud{top:60px;left:25%;right:25%}#work{left:50%}}
</style>

<body>
<div id="menu">
<div id="logo"><small>BIHARI GAON SIMULATOR</small><h1>हमारा गाँव</h1><b>★ LITTIPUR ★</b></div>
<div id="mbtns">
<button id="mPlay">▶ KHELO</button>
<button id="mLook">👳 Apna Hero Banao</button>
<button id="mTime">🌗 Din / Raat &amp; Graphics</button>
<button id="mFull">⛶ Full Screen</button>
<button id="mHelp">📖 Kaise Khele</button>
<button id="mNew">🔄 Naya Game</button>
</div>
</div>
<div id="look"><div id="lookRows"></div><button id="lookDone">✅ Hero Taiyaar</button></div>
<div id="bubble" class="box"></div>
<div id="stats" class="box">
<div id="money">₹100</div>
<div>🍛 Khana</div><div class="bar"><i id="bFood" style="background:#4cd964"></i></div>
<div>💩 Poty Pressure</div><div class="bar"><i id="bPoty" style="background:#c8863a"></i></div>
<div>❤️ Sehat</div><div class="bar"><i id="bHp" style="background:#ff4d5e"></i></div>
<div id="info"></div>
</div>
<canvas id="map" width="236" height="236"></canvas>
<div id="task" class="box"></div>
<div id="msg" class="box"></div>
<div id="joy"><div id="knob"></div></div>
<div id="btns"><button id="act2"></button><button id="act"></button><button id="fsBtn">⛶ Full Screen</button><button id="menuBtn">📋 Menu</button><button id="run">🏃 Daud</button></div>
<div id="fade"><div id="fadeText"></div><div id="prog"><i></i></div></div>
<div id="panel"><div id="card"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('panel').style.display='flex';$('card').textContent='3D engine load nahi hua. Internet check karke page dobara kholo.';return;}
const T=THREE;
const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);

const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new T.Scene();
scene.background=new T.Color(0x87bfe8);
scene.fog=new T.Fog(0x87bfe8,90,340);
const camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,.3,900);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hemi=new T.HemisphereLight(0xffffff,0x6b5530,.75);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff0cc,.65);sun.position.set(60,100,40);scene.add(sun);

/* ---------- builders ---------- */
const V2=(x,y)=>new T.Vector2(x,y);
/* canvas textures */
function tex(draw,s){const c=document.createElement('canvas');c.width=c.height=s||256;draw(c.getContext('2d'),c.width);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;return t;}
function speckle(g,s,n,cols,a,b){for(let i=0;i<n;i++){g.fillStyle=pick(cols);g.fillRect(Math.random()*s,Math.random()*s,R(a,b),R(a,b));}}
const TX={
 grass:{s:14,t:tex((g,s)=>{g.fillStyle='#e4e4e4';g.fillRect(0,0,s,s);speckle(g,s,2600,['#ffffff','#c9c9c9','#b4b4b4','#f4f4d8'],1,5);})},
 mud:{s:6,t:tex((g,s)=>{g.fillStyle='#e8e2da';g.fillRect(0,0,s,s);speckle(g,s,1500,['#ffffff','#c8bcae','#ad9f90','#f5efe6'],1,4);speckle(g,s,40,['#8f8273'],3,7);})},
 plaster:{s:4,t:tex((g,s)=>{g.fillStyle='#f2f2f2';g.fillRect(0,0,s,s);speckle(g,s,900,['#ffffff','#dedede','#cfcfcf'],1,6);for(let i=0;i<9;i++){g.fillStyle='rgba(90,60,30,.07)';g.beginPath();g.arc(R(0,s),R(0,s),R(8,34),0,7);g.fill();}})},
 brick:{s:2.6,t:tex((g,s)=>{g.fillStyle='#cfc6bb';g.fillRect(0,0,s,s);for(let r=0;r<8;r++)for(let c=-1;c<5;c++){const v=R(200,255)|0;g.fillStyle='rgb('+v+','+(v-14)+','+(v-24)+')';g.fillRect(c*64+(r%2)*32+2,r*32+2,60,28);}})},
 tile:{s:2.4,t:tex((g,s)=>{g.fillStyle='#8f8f8f';g.fillRect(0,0,s,s);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const gr=g.createLinearGradient(c*32,0,c*32+32,0);gr.addColorStop(0,'#9a9a9a');gr.addColorStop(.5,'#ffffff');gr.addColorStop(1,'#9a9a9a');g.fillStyle=gr;g.fillRect(c*32+1,r*32+(c%2)*3,30,27);}})},
 thatch:{s:3,t:tex((g,s)=>{g.fillStyle='#cdbd96';g.fillRect(0,0,s,s);for(let i=0;i<1100;i++){g.strokeStyle=pick(['#fff3c8','#a8915c','#e8d6a0','#8a7444']);g.lineWidth=R(1,2.5);const x=R(0,s),y=R(0,s);g.beginPath();g.moveTo(x,y);g.lineTo(x+R(-4,4),y+R(10,30));g.stroke();}})},
 wood:{s:2,t:tex((g,s)=>{g.fillStyle='#ddd';g.fillRect(0,0,s,s);for(let x=0;x<s;x+=4){g.fillStyle=pick(['#fff','#bbb','#999','#e8e8e8']);g.fillRect(x,0,R(1,4),s);}})}
};
const mats={};
function mat(c,t){const k=c+'|'+(t||'');return mats[k]||(mats[k]=new T.MeshLambertMaterial(t?{color:c,map:TX[t].t,side:T.DoubleSide}:{color:c}));}
function roofGeo(){ // gable roof, 1x1x1
  const a=[-.5,0,.5],b=[.5,0,.5],c=[.5,0,-.5],d=[-.5,0,-.5],e=[-.5,1,0],f=[.5,1,0];
  const p=[].concat(a,b,f,a,f,e, c,d,e,c,e,f, b,c,f, d,a,e);
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(p,3));g.computeVertexNormals();return g;}
const G={box:new T.BoxGeometry(1,1,1),cyl:new T.CylinderGeometry(.5,.5,1,8),cone:new T.ConeGeometry(.5,1,4),peak:new T.ConeGeometry(.5,1,14),leaf:new T.IcosahedronGeometry(.5,1),ball:new T.SphereGeometry(.5,10,7),roof:roofGeo(),
  taper:new T.CylinderGeometry(.5,.36,1,7),spike:new T.ConeGeometry(.5,1,4),tyre:new T.TorusGeometry(.38,.12,6,14),ring:new T.TorusGeometry(.5,.13,5,12),
  hair:new T.SphereGeometry(.5,12,6,0,Math.PI*2,0,Math.PI*.5),
  kurta:new T.LatheGeometry([V2(0,-.5),V2(.47,-.5),V2(.42,-.2),V2(.39,.05),V2(.47,.3),V2(.4,.43),V2(.17,.5),V2(0,.5)],10),
  skirt:new T.LatheGeometry([V2(0,-.5),V2(.5,-.5),V2(.43,-.2),V2(.3,.2),V2(.26,.5),V2(0,.5)],16)};
const stat=new T.Group(),deco=new T.Group(),chunks=[],decoChunks=[];
function mesh(geo,c,sx,sy,sz,x,y,z,parent,t){const m=new T.Mesh(G[geo],mat(c,t));m.scale.set(sx,sy,sz);m.position.set(x,y,z);(parent||stat).add(m);return m;}
const box=(c,w,h,d,x,y,z,p,t)=>mesh('box',c,w,h,d,x,y,z,p,t);
/* ek group ke saare hisse ko ek mesh mein jodo (phone ke liye tez) */
const vcMat=new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide});
function bake(group){
  const parts=group.children.filter(m=>m.isMesh&&m.material.isMeshLambertMaterial&&!m.material.map);
  if(!parts.length)return;const P=[],N=[],C=[];
  parts.forEach(m=>{m.updateMatrix();const g=m.geometry.index?m.geometry.toNonIndexed():m.geometry.clone();g.applyMatrix4(m.matrix);
    const p=g.attributes.position.array,n=g.attributes.normal.array,c=m.material.color;
    for(let i=0;i<p.length;i+=3){P.push(p[i],p[i+1],p[i+2]);N.push(n[i],n[i+1],n[i+2]);C.push(c.r,c.g,c.b);}g.dispose();group.remove(m);});
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(P,3));g.setAttribute('normal',new T.Float32BufferAttribute(N,3));g.setAttribute('color',new T.Float32BufferAttribute(C,3));
  const out=new T.Mesh(g,vcMat);out.castShadow=true;group.add(out);return out;}
const solids=[]; // rectangles {x,z,hw,hd}
const solid=(x,z,w,d)=>solids.push({x,z,hw:w/2,hd:d/2});
function label(text,x,y,z,w,bg,rot,parent){
  const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');
  g.fillStyle=bg||'#ffd21f';g.fillRect(0,0,512,96);g.strokeStyle='#fff';g.lineWidth=6;g.strokeRect(5,5,502,86);g.fillStyle=bg?'#fff':'#111';g.font='bold 44px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,50,480);
  const m=new T.Mesh(new T.PlaneGeometry(w,w*96/512),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide}));
  m.position.set(x,y,z);m.rotation.y=rot||0;(parent||scene).add(m);return m;
}
function nameTag(text,parent){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='bold 30px sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=6;g.strokeStyle='#000';g.strokeText(text,128,32,250);g.fillStyle='#ffe27a';g.fillText(text,128,32,250);
  const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(2.6,.65,1);s.position.y=3.15;parent.add(s);}
function glowTex(inner,outer){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,2,64,64,62);r.addColorStop(0,inner);r.addColorStop(.35,outer);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return new T.CanvasTexture(c);}

/* roshni wale material: raat ko chamakte hain */
const winMat=new T.MeshBasicMaterial({color:0x23404f}),bulbMat=new T.MeshBasicMaterial({color:0x777766});
const glowMat=new T.SpriteMaterial({map:glowTex('rgba(255,240,180,1)','rgba(255,180,60,.45)'),transparent:true,opacity:0,depthWrite:false,blending:T.AdditiveBlending});
function glow(x,y,z,s){const g=new T.Sprite(glowMat);g.position.set(x,y,z);g.scale.set(s,s,1);scene.add(g);}
function pane(w,h,d,x,y,z){const m=new T.Mesh(G.box,winMat);m.scale.set(w,h,d);m.position.set(x,y,z);scene.add(m);}

/* ground, roads */
box(0x86b344,640,1,640,0,-.5,0,null,'grass');

const C=h=>new T.Color(h),SKY={nt:C(0x040a24),nb:C(0x17264d),dt:C(0x2f7fd8),db:C(0xc4e6f6),et:C(0x3d4a8c),eb:C(0xff9a4a),sun:C(0xfff0d0),eve:C(0xff9a45),moon:C(0x8aa6ff),win:C(0x23404f),lit:C(0xffd777),off:C(0x77776a),on:C(0xfff0b0)};
function daylight(dt){
  const sp=wheelG.userData.spin;sp.rotation.z+=dt*.28;seats.forEach((c,i)=>{const a=sp.rotation.z+i*Math.PI/4;c.position.set(Math.cos(a)*7.2,Math.sin(a)*7.2,0);});
  const ang=(clock-6)/24*Math.PI*2,el=Math.sin(ang),day=clamp(el*2.6+.45,0,1),eve=clamp(1-Math.abs(el)*3.2,0,1),night=1-day;
  skyU.top.value.copy(SKY.nt).lerp(SKY.dt,day).lerp(SKY.et,eve*.65);skyU.bot.value.copy(SKY.nb).lerp(SKY.db,day).lerp(SKY.eb,eve*.8);
  scene.fog.color.copy(skyU.bot.value);scene.background.copy(skyU.bot.value);
  hemi.intensity=.36+day*.36;sun.intensity=.22+day*.62;sun.color.copy(SKY.moon).lerp(SKY.sun,day).lerp(SKY.eve,eve*.75);
  const p=player.position,up=el>-.08,dx=Math.cos(ang)*(up?1:-1),dy=Math.abs(el);
  sun.position.set(p.x+dx*70,22+dy*70,p.z+32);sun.target.position.set(p.x,0,p.z);
  sky.position.set(p.x,0,p.z);stars.position.copy(sky.position);
  sunS.position.set(p.x+Math.cos(ang)*380,el*250+12,p.z-170);moonS.position.set(p.x-Math.cos(ang)*380,-el*250+12,p.z+150);sunS.visible=el>-.12;moonS.visible=el<.12;
  stars.material.opacity=clamp(night*1.2-.2,0,1);flies.material.opacity=night*(.55+.45*Math.sin(performance.now()/260));flies.position.y=Math.sin(performance.now()/900)*.3;
  winMat.color.copy(SKY.win).lerp(SKY.lit,clamp(night*1.4-.2,0,1));bulbMat.color.copy(SKY.off).lerp(SKY.on,night);glowMat.opacity=clamp(night*1.3-.25,0,.9);headMat.opacity=.25+night*.75;
  torch.intensity=night*1.1;torch.position.set(p.x,4.2,p.z);
  clouds.forEach(c=>{c.position.x+=dt*1.6;if(c.position.x>380)c.position.x=-380;c.material.opacity=.25+day*.65;c.material.color.setRGB(.35+day*.65,.38+day*.62-eve*.12,.5+day*.5-eve*.25);});
  waterTex.offset.x+=dt*.025;waterTex.offset.y+=dt*.012;
}

  let v=vehicles.find(v=>dist(p,v.m.position)<3.2);if(v)return[[(v.owned===false?'🔓 '+v.type+' chori karo':'🔑 '+v.type+' chalao'),()=>chalao(v)],null];
  const tr=traffic.find(t=>dist(p,t.r.m.position)<4.4);if(tr)return[['🔓 '+tr.r.type+' chheeno (chori)',()=>chheeno(tr)],S.wanted?['💵 ₹500 case rafa-dafa',settle]:null];
  if(S.wanted&&cops.some(c=>c.on&&dist(p,c.m.position)<12))return[['💵 ₹500 case rafa-dafa',settle],null];
  if(near(SETH,4.5)&&!job)return[['💰 Kiraya vasooli ka kaam',kiraya],null];
  if(near(DHABA,6))return[['🍛 Litti Chokha khao',dhaba],null];
  if(near(CHAI,5))return[['☕ Chai piyo',chai],null];
  if(near(KIRANA,6))return[['🛒 Dukaan',kirana],['😠 Hafta maango',dukanVasooli]];

  if(L.ax==='z'&&gateDown){const d=(RZ-pos)*L.dir;if(d>9.5&&d<15)want=0;}
  t.cur+=clamp(want-t.cur,-dt*28,dt*6);let n=pos+t.cur*L.dir*dt;if(n>L.b)n=L.a;if(n<L.a)n=L.b;m.position[L.ax]=n;

/* ---------- update ---------- */
function angLerp(a,b,k){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k;}
let hudT=0,chug=0;
function update(dt){
  const ix=clamp(input.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),-1,1);
  const iy=clamp(input.y+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),-1,1);
  const running=input.run||keys.ShiftLeft;
  clock=(clock+dt/CFG.speed)%24;
  S.food=clamp(S.food-dt*(running?.55:.3),0,100);
  S.poty=clamp(S.poty+dt*(.35+(S.food>60?.15:0)),0,100);
  if(S.food<=0)S.hp=clamp(S.hp-dt*1.2,0,100);else if(S.food>50)S.hp=clamp(S.hp+dt*.25,0,100);
  if(S.poty>75&&!warned){warned=true;say('⚠️ Pet mein gud-gud! Jaldi khet bhaago!',3500);beep(180,.4,'sawtooth',.08);}
  if(S.poty<60)warned=false;
  if(S.poty>=100)return accident();
  if(S.hp<=0){const f=Math.min(S.money,80);pay(-f);S.hp=70;S.food=60;clearCops();driving=null;player.visible=true;player.position.set(3,0,8);return panel('🤕 Behosh ho gaye','Gaon wale daaktar ke paas le gaye.\nIlaaj kharcha ₹'+f+'. Khana time par khao!',[['Uth gaye 💪',null]]);}

  /* movement */
  if(driving){const v=driving,m=v.m;
    if(Math.abs(iy)>.15)v.v+=iy*v.acc*dt*(Math.sign(iy)!==Math.sign(v.v)&&Math.abs(v.v)>1?2.4:1);else v.v*=Math.pow(.35,dt);
    v.v=clamp(v.v,-7,v.max*(running?1.15:1));
    if(Math.abs(ix)>.12)m.rotation.y-=ix*v.turn*dt*clamp(v.v/7,-1,1);
    const o={x:m.position.x,z:m.position.z};
    if(!move(o,Math.sin(m.rotation.y)*v.v*dt,Math.cos(m.rotation.y)*v.v*dt,v.r)){if(Math.abs(v.v)>10){beep(90,.2,'sawtooth',.1);S.hp=clamp(S.hp-4,0,100);}v.v*=-.2;}
    m.position.x=o.x;m.position.z=o.z;player.position.set(o.x,0,o.z);player.rotation.y=m.rotation.y;
    seatPlayer(v);
    if(dragT<=0&&Math.abs(v.v)>1)yaw=angLerp(yaw,m.rotation.y+Math.PI,Math.min(1,dt*3));
  }else{
    const l=Math.hypot(ix,iy);let sp=0;
    if(l>.12){sp=(running?9:4.8)*Math.min(1,l);if(S.food<10||S.poty>85)sp*=.75;
      const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);const dx=(fx*iy+rx*ix)/l,dz=(fz*iy+rz*ix)/l;
      move(player.position,dx*sp*dt,dz*sp*dt,.45);player.rotation.y=angLerp(player.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*12));}
    animate(player,sp,dt);
  }
  dragT-=dt;

  /* log */
  folks.forEach(f=>{f.cool-=dt;const m=f.m,p=f.p;let sp=f.sp;if(f.down>0||f.mad>0||f.flee>0){m.visible=true;return;}
    if(f.stop>0){f.stop-=dt;sp=0;}
    if(driving&&Math.abs(driving.v)>5&&dist(m.position,driving.m.position)<driving.r+1){const a=driving.m.rotation.y;m.position.x+=Math.cos(a)*2.2;m.position.z-=Math.sin(a)*2.2;f.stop=2;S.izzat=clamp(S.izzat-3,0,100);say(f.name+': "Aankh hai ki button? 😡"');addWanted(1);driving.v*=.4;}
    if(sp){const ax=p.ax;m.position[ax]+=f.dir*sp*dt;if(m.position[ax]>p.b)f.dir=-1;if(m.position[ax]<p.a)f.dir=1;
      const o=ax==='x'?'z':'x';m.position[o]+=clamp(p.fix-m.position[o],-dt*2,dt*2);
      if(gateDown&&ax==='z'&&Math.abs(m.position.z-RZ)<12&&Math.abs(m.position.z-RZ)>8&&(RZ-m.position.z)*f.dir>0){m.position.z-=f.dir*sp*dt;sp=0;}
      m.rotation.y=ax==='x'?f.dir*Math.PI/2:(f.dir>0?0:Math.PI);}
    m.visible=dist(m.position,player.position)<Q.npc;if(m.visible)animate(m,sp,dt);});
  idlers.forEach(m=>{if(!game||game.f.m!==m){if(dist(m.position,player.position)<40)animate(m,0,dt);}});

  updateTraffic(dt);

  /* police */
  if(S.wanted>0){wantTimer-=dt;let far=true;cops.forEach(c=>{if(!c.on||c.down>0)return;const m=c.m,dx=player.position.x-m.position.x,dz=player.position.z-m.position.z,d=Math.hypot(dx,dz)||1,sp=6+S.wanted*.5;
      move(m.position,dx/d*sp*dt,dz/d*sp*dt,.3);m.rotation.y=Math.atan2(dx,dz);animate(m,sp,dt);if(d<55)far=false;if(d<(driving?2.4:1.5)&&(!driving||Math.abs(driving.v)<8))arrest();});
    if(far)wantTimer-=dt*3;if(S.wanted>0&&wantTimer<=0){clearCops();say('Bach gaye! Daroga thak ke chai peene chala gaya ☕');}}

  /* pakdam pakdai */
  if(game){const g=game,m=g.f.m;g.t-=dt;g.turn-=dt;const dx=m.position.x-player.position.x,dz=m.position.z-player.position.z,d=Math.hypot(dx,dz);
    if(g.turn<=0){g.turn=R(.6,1.4);g.a=d<18?Math.atan2(dx,dz)+R(-.9,.9):R(0,6.28);}
    if(Math.hypot(m.position.x,m.position.z)>90)g.a=Math.atan2(-m.position.x,-m.position.z)+R(-.7,.7);
    const sp=d<18?7.4:3;if(!move(m.position,Math.sin(g.a)*sp*dt,Math.cos(g.a)*sp*dt,.4))g.a+=R(1,2.5);
    m.rotation.y=g.a;animate(m,sp,dt);
    if(d<1.7&&!driving)endPakdam(true);else if(g.t<=0)endPakdam(false);}

  /* kaam */
  if(job){const s=job.steps[job.i];job.t-=dt;marker.visible=true;marker.position.set(s.x,0,s.z);mk.position.y=6+Math.sin(performance.now()/200)*.6;ring.rotation.z+=dt*2;
    if(dist(player.position,s)<3.2){job.i++;beep(700,.15,'sine',.1);const got=rentStep(s);if(job.i>=job.steps.length){const r=job.bag!==undefined?(job.bag*.4|0)+80:job.reward;pay(r);S.kaam++;S.izzat=clamp(S.izzat+6,0,100);say('✅ '+job.name+' poora! Kamaai ₹'+r,3500);job=null;}else if(!got)say('👍 '+job.steps[job.i].text);}
    else if(job.t<=0){say('⏰ Time khatam! Kaam adhoora raha.');job=null;}}
  if(!job)marker.visible=false;

  /* train aur phatak */
  trainTimer-=dt;
  if(trainState==='wait'){if(trainTimer<7)gateDown=Math.abs(player.position.z-(RZ+8))>1.5&&Math.abs(player.position.z-(RZ-8))>1.5||gateDown;
    if(trainTimer<=0){trainState='run';trainDir=Math.random()<.5?1:-1;train.position.x=-trainDir*330;train.rotation.y=trainDir>0?0:Math.PI;say('🚂 Gaadi aa rahi hai! Phatak band',2500);}}
  else{train.position.x+=trainDir*34*dt;const d=Math.abs(player.position.z-RZ);chug-=dt;
    if(chug<=0&&Math.abs(train.position.x-player.position.x)<110&&d<90){chug=.28;beep(70,.12,'triangle',.12*(1-d/100));if(Math.random()<.07)beep(370,1.1,'sawtooth',.05);}
    if(train.position.x*trainDir>430){trainState='wait';trainTimer=R(35,65);gateDown=false;}}
  /* train ki patri par khade ho to dhakka dekar hatao */
  if(trainState==='run'&&Math.abs(player.position.z-RZ)<2.8){const h=train.position.x,a=h-trainDir*(TRAINCOUNT*11+7),b=h+trainDir*9,x=player.position.x;
    if(x>Math.min(a,b)&&x<Math.max(a,b)){const z=RZ+(player.position.z>=RZ?4:-4);player.position.z=z;if(driving){driving.m.position.z=z;driving.v=0;}S.hp=clamp(S.hp-15,0,100);say('😱 Baal-baal bache! Patri se door raho.');}}
  gates.forEach(g=>{const want=gateDown?0:-g.side*1.35;g.piv.rotation.z+=(want-g.piv.rotation.z)*Math.min(1,dt*2.5);});
  lamp.material.color.setHex(gateDown&&(performance.now()/300|0)%2?0xff2020:gateDown?0x550000:0x22aa22);

  daylight(dt);

  hudT-=dt;if(hudT<=0){hudT=.15;
    $('money').textContent='₹'+S.money;$('bFood').style.width=S.food+'%';$('bPoty').style.width=S.poty+'%';$('bPoty').style.background=S.poty>75?'#ff3b30':'#c8863a';$('bHp').style.width=S.hp+'%';
    const hh=clock|0,mm=(clock%1*60)|0;
    $('info').textContent='🕒 '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+'  '+(S.lota?'🪣':'')+' ⭐'+(S.izzat|0)+(S.wanted?' '+'🚨'.repeat(S.wanted):'');
    const tk=$('task');if(job){tk.style.display='block';tk.textContent=job.name+' ('+(job.i+1)+'/'+job.steps.length+') '+job.steps[job.i].text+' ⏱'+Math.ceil(job.t)+'s';}else if(game){tk.style.display='block';tk.textContent='🏃 '+game.f.name+' ko pakdo! ⏱'+Math.ceil(game.t)+'s';}else tk.style.display='none';
    refreshButtons();drawMap();}
}

let last=performance.now(),saveT=0;
